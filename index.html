    const { useState, useEffect, useRef } = React;

        <path d="M 134,235 C 145,230 155,235 159,238 C 163,235 173,230 184,235 L 184,260 C 173,255 163,260 159,263 C 155,260 145,255 134,260 Z" fill="#ffffff" stroke="url(#goldGrad)" strokeWidth="2" />
        <rect x="202" y="212" width="78" height="70" fill="#ffffff" />

        <line x1="120" y1="210" x2="282" y2="210" stroke="url(#goldGrad)" strokeWidth="4" />
        <path d="M 60,260 C 130,360 270,360 340,260 C 310,290 270,315 200,315 C 130,315 90,290 60,260 Z" fill="url(#goldGrad)" />

        <text fill="#ffffff" fontSize="22" fontWeight="900" letterSpacing="6">
          <textPath href="#ribbonArc" startOffset="50%" textAnchor="middle">
            MAADI GRADE 5
          </textPath>
        </text>
      </svg>
    );

    const SWEAR_WORDS = [
      'fuck', 'shit', 'bitch', 'asshole', 'bastard', 'crap', 'dick', 'pussy',
      'koss', 'kos', 'sharmouta', 'entom', 'ahbal', 'kalb', 'khara', 'gahba',
      'damn', 'stupid'
    ];

    const EMOJI_LIST = [
      '😀', '😂', '😎', '😍', '🥳', '🔥', '👑', '⭐', '🚀', '💯', 
      '👍', '👏', '🙌', '🎉', '📚', '✏️', '🏫', '🤖', '💡', '🏆', 
      '❤️', '⚡', '🎮', '⚽', '🎯', '✨', '🧠', '💬', '📢', '📌'
    ];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [studentNameInput, setStudentNameInput] = useState('');
      const [secretCodeInput, setSecretCodeInput] = useState('');
      const [loginError, setLoginError] = useState('');
      
      const [isBanned, setIsBanned] = useState(false);
      const [banReason, setBanReason] = useState('');
      const [bannedAccounts, setBannedAccounts] = useState([]);

      const [user, setUser] = useState(null);
      const [authUser, setAuthUser] = useState(null);
      const [activeTab, setActiveTab] = useState('global_chat');
      const [toastMessage, setToastMessage] = useState(null);

      const [globalMessages, setGlobalMessages] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);
      const chatEndRef = useRef(null);

      const [onlineStudents, setOnlineStudents] = useState([]);

      const [aiMessages, setAiMessages] = useState([]);
      const [aiInput, setAiInput] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const aiChatEndRef = useRef(null);

      const [isRecording, setIsRecording] = useState(false);
      const [mediaRecorder, setMediaRecorder] = useState(null);
      const [recordingTime, setRecordingTime] = useState(0);
      const [isDictating, setIsDictating] = useState(false);
      const [speakingMsgId, setSpeakingMsgId] = useState(null);

      useEffect(() => {
        const checkFirebase = () => {
          if (!window.FirebaseCloud) {
            setTimeout(checkFirebase, 100);
            return;
          }

          const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseCloud;

          const initAuth = async () => {
            try {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            } catch (err) {
              console.warn("Auth initialization fallback:", err);
            }
          };

          initAuth();

          onAuthStateChanged(auth, (usr) => {
            if (usr) {
              setAuthUser(usr);
              setupCloudListeners();
            }
          });
        };

        checkFirebase();
      }, []);

      const setupCloudListeners = () => {
        if (!window.FirebaseCloud) return;
        const { db, appId, collection, onSnapshot } = window.FirebaseCloud;

        const bannedRef = collection(db, 'artifacts', appId, 'public', 'data', 'banned_users');
        onSnapshot(bannedRef, (snapshot) => {
          const bans = [];
          snapshot.forEach((d) => bans.push({ id: d.id, ...d.data() }));
          setBannedAccounts(bans);

          if (user) {
            const cleanUserName = user.name.toLowerCase().replace(/\s+/g, '');
            const matchBan = bans.find(b => 
              (b.uid && b.uid === authUser?.uid) || 
              (b.nameClean && b.nameClean === cleanUserName)
            );
            if (matchBan) {
              setIsBanned(true);
              setBanReason(matchBan.reason || 'Cloud Account Ban: Violation of school standards.');
            }
          }
        });

        const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'global_messages');
        onSnapshot(messagesRef, (snapshot) => {
          const msgs = [];
          snapshot.forEach((doc) => msgs.push({ id: doc.id, ...doc.data() }));
          msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          if (msgs.length === 0) {
            setGlobalMessages([{
              id: 'init_welcome',
              sender: 'Mohamed Hossam (SITE IT & SITE OWNER) 👑',
              isOwner: true,
              text: 'Welcome to the official Grade 5 live portal! Featuring voice notes, speech recognition, and cloud account moderation.',
              time: '10:00 AM',
              createdAt: Date.now()
            }]);
          } else {
            setGlobalMessages(msgs);
          }
        });

        const presenceRef = collection(db, 'artifacts', appId, 'public', 'data', 'online_presence');
        onSnapshot(presenceRef, (snapshot) => {
          const now = Date.now();
          const active = [];
          snapshot.forEach((doc) => {
            const data = doc.data();
            if (now - (data.lastSeen || 0) < 15000) active.push(data);
          });
          setOnlineStudents(active);
        });
      };

      useEffect(() => {
        if (!isLoggedIn || !user || isBanned || !authUser || !window.FirebaseCloud) return;

        const { db, appId, doc, setDoc } = window.FirebaseCloud;
        const userPresenceDoc = doc(db, 'artifacts', appId, 'public', 'data', 'online_presence', authUser.uid);

        const updatePresence = async () => {
          try {
            await setDoc(userPresenceDoc, {
              uid: authUser.uid,
              name: user.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : user.name,
              isOwner: user.isOwner,
              lastSeen: Date.now()
            });
          } catch (e) {}
        };

        updatePresence();
        const interval = setInterval(updatePresence, 5000);
        return () => clearInterval(interval);
      }, [isLoggedIn, user, isBanned, authUser]);

      useEffect(() => {
        let timer;
        if (isRecording) {
          timer = setInterval(() => setRecordingTime(prev => prev + 1), 1000);
        } else {
          setRecordingTime(0);
        }
        return () => clearInterval(timer);
      }, [isRecording]);

      const showNotification = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3800);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const cleanName = studentNameInput.trim();
        const cleanCode = secretCodeInput.trim();

        const isOwnerCode = cleanCode === 'Iamtheowner_lol';
        const isStudentCode = cleanCode === 'PRIM5EDU';

        if (!isOwnerCode && !isStudentCode) {
          setLoginError('❌ Incorrect Secret Passcode! (Student Code: PRIM5EDU)');
          return;
        }

        if (!cleanName) {
          setLoginError('❌ Please enter your full name');
          return;
        }

        const nameKey = cleanName.toLowerCase().replace(/\s+/g, '');
        const foundBan = bannedAccounts.find(b => b.nameClean === nameKey || (authUser && b.uid === authUser.uid));

        if (foundBan) {
          setIsBanned(true);
          setBanReason(foundBan.reason || 'Cloud Account Ban: Prohibited account.');
          return;
        }

        const isOwner = isOwnerCode || nameKey === 'mohamedhossam';
        const formattedName = isOwner ? 'Mohamed Hossam' : cleanName;

        const newUser = { name: formattedName, isOwner, swearCount: 0 };
        setUser(newUser);
        setIsLoggedIn(true);

        const initialAiText = isOwner
          ? `Welcome back, Master Mohamed Hossam! 👑 EduAi is online.`
          : `Hello ${formattedName}! I am EduAi, your Grade 5 tutor. Try voice notes, text-to-speech, or homework questions!`;

        setAiMessages([{ id: 1, sender: 'EduAi 🤖', text: initialAiText, time: 'Just now', isAi: true }]);
        showNotification(`Welcome ${isOwner ? 'Master Mohamed Hossam!' : formattedName}`);
      };

      const checkForProfanity = (text) => {
        const lower = text.toLowerCase();
        return SWEAR_WORDS.some(word => lower.includes(word));
      };

      const executeBan = async (reasonText, targetUid, targetName) => {
        const reason = reasonText || 'Account banned permanently.';
        const uidToBan = targetUid || authUser?.uid;
        const nameToBan = targetName || user?.name;
        const cleanNameKey = (nameToBan || '').toLowerCase().replace(/\s+/g, '');

        setIsBanned(true);
        setBanReason(reason);

        if (window.FirebaseCloud) {
          const { db, appId, doc, setDoc } = window.FirebaseCloud;
          try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'banned_users', `ban_${uidToBan || cleanNameKey}`), {
              uid: uidToBan || 'unknown',
              name: nameToBan || 'Student',
              nameClean: cleanNameKey,
              reason: reason,
              bannedAt: Date.now(),
              bannedBy: user?.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : 'Auto-Moderator'
            });
          } catch (e) {}
        }
      };

      const handleSendGlobalMessage = async (e) => {
        if (e) e.preventDefault();
        const text = chatInput.trim();
        if (!text || !user || isBanned) return;

        if (checkForProfanity(text)) {
          const updatedSwearCount = user.swearCount + 1;
          setUser(prev => ({ ...prev, swearCount: updatedSwearCount }));

          if (updatedSwearCount >= 3) {
            await executeBan('Account permanently banned for repeating profane language in global chat.');
            return;
          } else {
            showNotification(`⚠️ WARNING (${updatedSwearCount}/3): Swearing is forbidden! At 3 warnings your account WILL BE CLOUD BANNED.`);
            setChatInput('');
            return;
          }
        }

        const msgObj = {
          sender: user.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : user.name,
          senderUid: authUser?.uid || 'anonymous',
          senderCleanName: user.name.toLowerCase().replace(/\s+/g, ''),
          isOwner: user.isOwner,
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          createdAt: Date.now()
        };

        setChatInput('');
        setShowEmojiPicker(false);

        if (window.FirebaseCloud && authUser) {
          const { db, appId, collection, addDoc } = window.FirebaseCloud;
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'global_messages'), msgObj);
        }

        if (text.toLowerCase().includes('eduai') || text.toLowerCase().includes('@eduai') || text.endsWith('?')) {
          triggerEduAiInGlobalChat(text);
        }
      };

      const startVoiceRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          const chunks = [];

          recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
          recorder.onstop = async () => {
            const audioBlob = new Blob(chunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
              const base64Audio = reader.result;
              const msgObj = {
                sender: user.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : user.name,
                senderUid: authUser?.uid,
                isOwner: user.isOwner,
                audioUrl: base64Audio,
                text: '🎤 Voice Note',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                createdAt: Date.now()
              };

              if (window.FirebaseCloud && authUser) {
                const { db, appId, collection, addDoc } = window.FirebaseCloud;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'global_messages'), msgObj);
              }
            };
            stream.getTracks().forEach(track => track.stop());
          };

          recorder.start();
          setMediaRecorder(recorder);
          setIsRecording(true);
          showNotification("🎙️ Recording Voice Note... Speak now!");
        } catch (err) {
          showNotification("❌ Microphone access denied or unsupported.");
        }
      };

      const stopVoiceRecording = () => {
        if (mediaRecorder && isRecording) {
          mediaRecorder.stop();
          setIsRecording(false);
          setMediaRecorder(null);
        }
      };

      const speakText = (msgId, text) => {
        if (!('speechSynthesis' in window)) return;
        if (speakingMsgId === msgId) {
          window.speechSynthesis.cancel();
          setSpeakingMsgId(null);
          return;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/🎤 Voice Note/g, 'Voice message'));
        utterance.onend = () => setSpeakingMsgId(null);
        utterance.onerror = () => setSpeakingMsgId(null);
        setSpeakingMsgId(msgId);
        window.speechSynthesis.speak(utterance);
      };

      const toggleSpeechRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showNotification("❌ Dictation not supported in this browser.");
          return;
        }

        if (isDictating) {
          setIsDictating(false);
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.onstart = () => {
          setIsDictating(true);
          showNotification("🗣️ Listening... Speak your message!");
        };
        recognition.onresult = (e) => {
          setChatInput(prev => prev ? `${prev} ${e.results[0][0].transcript}` : e.results[0][0].transcript);
          setIsDictating(false);
        };
        recognition.onerror = () => setIsDictating(false);
        recognition.onend = () => setIsDictating(false);
        recognition.start();
      };

      const triggerEduAiInGlobalChat = async (userQuestion) => {
        try {
          const systemPrompt = `You are EduAi, the smart AI assistant inside the live Global Chat for Grade 5 at Thebes Language School Maadi.
          RULE 1: If talking to Mohamed Hossam, address him as "Master Mohamed Hossam".
          RULE 2: Keep responses concise (2-4 sentences).`;

          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userQuestion }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });

          const data = await response.json();
          let replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "EduAi is online!";

          const aiMsgObj = {
            sender: 'EduAi 🤖',
            isAi: true,
            text: replyText,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            createdAt: Date.now() + 100
          };

          if (window.FirebaseCloud && authUser) {
            const { db, appId, collection, addDoc } = window.FirebaseCloud;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'global_messages'), aiMsgObj);
          }
        } catch (err) {}
      };

      const handleSendAiTabMessage = async () => {
        if (!aiInput.trim() || isAiLoading) return;
        const query = aiInput;
        setAiMessages(prev => [...prev, {
          id: Date.now(),
          sender: user.isOwner ? 'Master Mohamed Hossam 👑' : user.name,
          text: query,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          isAi: false
        }]);
        setAiInput('');
        setIsAiLoading(true);

        try {
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: query }] }],
              systemInstruction: { parts: [{ text: `You are EduAi Grade 5 tutor. Address Mohamed Hossam as Master Mohamed Hossam.` }] }
            })
          });

          const data = await response.json();
          let replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "How can I help you today?";

          setAiMessages(prev => [...prev, {
            id: Date.now() + 1,
            sender: 'EduAi 🤖',
            text: replyText,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            isAi: true
          }]);
        } catch (err) {} finally {
          setIsAiLoading(false);
        }
      };

      if (isBanned) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-red-950/40 border border-red-600/50 rounded-3xl p-8 text-center space-y-6 backdrop-blur-xl shadow-2xl">
              <div className="w-20 h-20 bg-red-600/20 text-red-500 rounded-full flex items-center justify-center text-4xl mx-auto border border-red-500/40 animate-pulse">🚫</div>
              <h1 className="text-2xl font-black text-red-400">ACCOUNT PERMANENTLY BANNED</h1>
              <div className="bg-slate-900/90 border border-red-500/30 p-4 rounded-2xl text-xs text-red-300 font-mono text-left">{banReason}</div>
              <p className="text-[11px] text-slate-400">Persistent cloud ban active. Contact Site Owner <strong>Mohamed Hossam</strong>.</p>
            </div>
          </div>
        );
      }

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-slate-900/95 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-3">
                <ThebesLogo className="w-20 h-20 mx-auto drop-shadow-xl" />
                <h1 className="text-2xl font-black bg-gradient-to-r from-white via-amber-200 to-amber-400 bg-clip-text text-transparent">THEBES MAADI GRADE 5</h1>
                <div className="inline-block bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold px-3 py-1 rounded-full uppercase">🔒 Cloud Account Gate</div>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Your Full Name:</label>
                  <input type="text" required value={studentNameInput} onChange={(e) => setStudentNameInput(e.target.value)} placeholder="e.g. Mohamed Hossam" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Class Secret Passcode:</label>
                  <input type="password" required value={secretCodeInput} onChange={(e) => setSecretCodeInput(e.target.value)} placeholder="Enter secret code" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400" />
                  <span className="text-[10px] text-amber-400/80 mt-1 block">💡 Passcode: PRIM5EDU (Students)</span>
                </div>
                {loginError && <div className="bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold p-3 rounded-xl text-center">{loginError}</div>}
                <button type="submit" className="w-full bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 text-slate-950 font-black py-3.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/20 hover:brightness-110">🚀 Unlock Portal</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">
          {toastMessage && (
            <div className="fixed top-20 right-4 z-50 bg-amber-500 text-slate-950 px-5 py-3 rounded-xl shadow-2xl font-bold border border-amber-300 animate-bounce flex items-center gap-2">
              <span>✨</span> {toastMessage}
            </div>
          )}

          <div className="bg-gradient-to-r from-blue-950 via-indigo-950 to-blue-950 border-b border-blue-800/50 py-2 px-4 text-xs font-medium flex items-center justify-between">
            <div className="flex items-center gap-2 shrink-0">
              <span className="bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border border-amber-400/30">THEBES MAADI GRADE 5</span>
              <span className="text-emerald-400 text-[11px] font-semibold flex items-center gap-1">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping inline-block" /> Live Voice Notes & Cloud Moderation Connected
              </span>
            </div>
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-800">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
                <span className="text-xs text-emerald-300 font-bold">{onlineStudents.length || 1} Online</span>
              </div>
              <button onClick={() => setIsLoggedIn(false)} className="text-xs text-slate-400 hover:text-red-400 transition">🔒 Exit</button>
            </div>
          </div>

          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <ThebesLogo className="w-12 h-12" />
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-black tracking-tight text-white">THEBES COMMUNITY</h1>
                    {user.isOwner && <span className="bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-md shadow-md animate-pulse">SITE IT & SITE OWNER 👑</span>}
                  </div>
                  <p className="text-xs text-amber-400 font-semibold uppercase">{user.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : user.name}</p>
                </div>
              </div>
              <nav className="flex items-center gap-1 bg-slate-950/60 p-1.5 rounded-2xl border border-slate-800">
                {[{ id: 'global_chat', label: 'Global Chat', icon: '🌐' }, { id: 'eduai', label: user.isOwner ? 'EduAi Master Assistant' : 'EduAi Assistant', icon: '🤖' }].map((item) => (
                  <button key={item.id} onClick={() => setActiveTab(item.id)} className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition flex items-center gap-2 ${activeTab === item.id ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                    <span>{item.icon}</span><span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'global_chat' && (
              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 h-[720px]">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4 flex flex-col justify-between">
                  <div>
                    <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider px-2 flex items-center justify-between">
                      <span>🟢 Online Students</span>
                      <span className="bg-amber-400/20 text-amber-300 px-2 py-0.5 rounded-full font-mono text-[10px]">{onlineStudents.length || 1}</span>
                    </h3>
                    <div className="space-y-2 mt-4 max-h-[460px] overflow-y-auto">
                      {onlineStudents.length > 0 ? (
                        onlineStudents.map((st, i) => (
                          <div key={i} className="p-2.5 bg-slate-950/70 border border-slate-800 rounded-xl flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 truncate">
                              <div className="w-8 h-8 rounded-full bg-blue-900/60 border border-blue-500/40 flex items-center justify-center font-bold text-amber-300 text-xs shrink-0">{st.isOwner ? '👑' : (st.name || 'S').charAt(0)}</div>
                              <div className="truncate text-xs font-bold text-white">{st.name}</div>
                            </div>
                            {user.isOwner && !st.isOwner && (
                              <button onClick={() => executeBan("Account banned by Owner.", st.uid, st.name)} className="bg-red-500/20 hover:bg-red-600 text-red-400 hover:text-white text-[10px] font-bold px-2 py-1 rounded-lg border border-red-500/30 transition shrink-0">🔨 Ban</button>
                            )}
                          </div>
                        ))
                      ) : (
                        <div className="p-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-xs text-slate-400 text-center">{user.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : user.name}</div>
                      )}
                    </div>
                  </div>
                  <div className="bg-amber-950/30 border border-amber-800/40 p-3 rounded-xl text-[11px] text-amber-300">
                    <div className="font-bold">🛡️ Cloud Moderation:</div>
                    <p className="text-slate-300">Swear filter is live. Account bans persist in Cloud Firestore!</p>
                  </div>
                </div>

                <div className="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-2xl relative">
                  <div className="border-b border-slate-800 pb-3 mb-3 flex items-center justify-between px-2">
                    <div>
                      <h2 className="font-black text-white text-lg flex items-center gap-2"><span>🌐 Live Cloud Global Chat</span></h2>
                      <p className="text-xs text-slate-400">Voice Notes • Speech Dictation • Text-to-Speech Enabled</p>
                    </div>
                  </div>

                  <div className="overflow-y-auto flex-1 space-y-3 pr-2">
                    {globalMessages.map((msg, idx) => {
                      const isMsgSpeaking = speakingMsgId === (msg.id || idx);
                      return (
                        <div key={msg.id || idx} className={`p-3.5 rounded-2xl space-y-2 transition ${msg.isAi ? 'bg-amber-950/30 border border-amber-500/50 text-amber-200' : msg.isOwner ? 'bg-gradient-to-r from-amber-950/40 via-slate-900 to-slate-900 border border-amber-500/40' : 'bg-slate-950/80 border border-slate-800'}`}>
                          <div className="flex items-center justify-between">
                            <span className={`font-bold text-sm flex items-center gap-1 ${msg.isAi ? 'text-amber-400' : msg.isOwner ? 'text-amber-300' : 'text-blue-300'}`}>{msg.sender}</span>
                            <div className="flex items-center gap-2">
                              {msg.text && (
                                <button onClick={() => speakText(msg.id || idx, msg.text)} className={`p-1 px-2 rounded-lg text-xs font-semibold transition border ${isMsgSpeaking ? 'bg-amber-400 text-slate-950 border-amber-300 animate-pulse' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}>
                                  {isMsgSpeaking ? '🔊 Speaking...' : '🗣️ Listen'}
                                </button>
                              )}
                              {user.isOwner && !msg.isOwner && !msg.isAi && (
                                <button onClick={() => executeBan("Banned for chat violation.", msg.senderUid, msg.sender)} className="text-[10px] bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-2 py-0.5 rounded border border-red-500/40">Ban User</button>
                              )}
                              <span className="text-[10px] text-slate-500 font-mono">{msg.time}</span>
                            </div>
                          </div>
                          {msg.audioUrl ? (
                            <div className="bg-slate-900/90 p-2 rounded-xl border border-slate-700 max-w-sm">
                              <audio controls src={msg.audioUrl} className="w-full h-8" />
                            </div>
                          ) : (
                            <p className="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                          )}
                        </div>
                      );
                    })}
                    <div ref={chatEndRef} />
                  </div>

                  {showEmojiPicker && (
                    <div className="absolute bottom-20 left-4 z-30 bg-slate-900 border border-slate-700 p-3 rounded-2xl shadow-2xl grid grid-cols-10 gap-2 max-w-sm">
                      {EMOJI_LIST.map((emo, i) => (
                        <button key={i} type="button" onClick={() => setChatInput(prev => prev + emo)} className="text-xl hover:scale-125 transition transform">{emo}</button>
                      ))}
                    </div>
                  )}

                  <form onSubmit={handleSendGlobalMessage} className="mt-4 flex gap-2 pt-3 border-t border-slate-800 items-center">
                    <button type="button" onClick={() => setShowEmojiPicker(prev => !prev)} className="bg-slate-800 hover:bg-slate-700 text-amber-300 p-3 rounded-xl border border-slate-700 text-base" title="Emoji Picker">😀</button>
                    <button type="button" onClick={isRecording ? stopVoiceRecording : startVoiceRecording} className={`p-3 rounded-xl border font-bold text-sm transition ${isRecording ? 'bg-red-600 text-white border-red-400 animate-pulse' : 'bg-slate-800 hover:bg-slate-700 text-rose-400 border-slate-700'}`} title={isRecording ? "Stop & Send" : "Record Voice Note"}>🎙️ {isRecording ? `${recordingTime}s` : ''}</button>
                    <button type="button" onClick={toggleSpeechRecognition} className={`p-3 rounded-xl border text-base ${isDictating ? 'bg-amber-500 text-slate-950 animate-bounce' : 'bg-slate-800 hover:bg-slate-700 text-blue-300 border-slate-700'}`} title="Speech Dictation">🗣️</button>
                    <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} placeholder="Send a global message..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400" />
                    <button type="submit" disabled={!chatInput.trim()} className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold px-6 py-3 rounded-xl text-sm shadow-lg shadow-blue-600/30">Send 🚀</button>
                  </form>
                </div>
              </div>
            )}

            {activeTab === 'eduai' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-gradient-to-r from-blue-950 via-indigo-900 to-slate-900 border border-blue-700/50 rounded-2xl p-6 flex items-center gap-4">
                  <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-400 to-yellow-200 text-slate-950 flex items-center justify-center text-3xl font-black">🤖</div>
                  <div>
                    <h2 className="text-2xl font-black text-white">EduAi {user.isOwner ? 'Master Assistant' : 'Grade 5 Tutor'}</h2>
                    <p className="text-xs text-slate-300">{user.isOwner ? "Master Mohamed Hossam, EduAi is at your service!" : "Ask Grade 5 study & homework questions!"}</p>
                  </div>
                </div>

                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-6 h-[500px] flex flex-col justify-between shadow-2xl">
                  <div className="overflow-y-auto space-y-4 pr-2">
                    {aiMessages.map((msg) => (
                      <div key={msg.id} className={`flex items-start gap-3 ${msg.isAi ? '' : 'flex-row-reverse'}`}>
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg shrink-0 ${msg.isAi ? 'bg-amber-400 text-slate-950' : 'bg-blue-600 text-white'}`}>{msg.isAi ? '🤖' : '👨‍🎓'}</div>
                        <div className={`max-w-[80%] rounded-2xl p-4 space-y-1 text-sm ${msg.isAi ? 'bg-slate-800/90 border border-slate-700/60 text-slate-100' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white'}`}>
                          <div className="flex items-center justify-between text-[10px] opacity-75 font-semibold">
                            <span>{msg.sender}</span>
                            <button onClick={() => speakText(msg.id, msg.text)} className="hover:text-amber-300">🔊</button>
                          </div>
                          <div className="whitespace-pre-wrap">{msg.text}</div>
                        </div>
                      </div>
                    ))}
                    {isAiLoading && <div className="text-xs text-amber-300 font-semibold animate-pulse">EduAi is thinking...</div>}
                    <div ref={aiChatEndRef} />
                  </div>

                  <form onSubmit={(e) => { e.preventDefault(); handleSendAiTabMessage(); }} className="mt-4 flex gap-2 pt-3 border-t border-slate-800">
                    <input type="text" value={aiInput} onChange={(e) => setAiInput(e.target.value)} placeholder="Ask EduAi..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400" />
                    <button type="submit" disabled={isAiLoading || !aiInput.trim()} className="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-extrabold px-6 py-3 rounded-xl text-sm">Ask</button>
                  </form>
                </div>
              </div>
            )}
          </main>

          <footer className="mt-16 border-t border-slate-800/80 bg-slate-950 py-8 text-center text-xs text-slate-500">
            © 2026 Thebes Language School - Maadi Branch. Managed by Mohamed Hossam (SITE IT & SITE OWNER).
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
