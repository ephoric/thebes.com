<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thebes Maadi Grade 5 Community</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for inline JSX processing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Shield Logo for Thebes Language School
    const ThebesLogo = ({ className = "w-12 h-12" }) => (
      <svg viewBox="0 0 400 400" className={className} xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#fef08a" />
            <stop offset="50%" stopColor="#eab308" />
            <stop offset="100%" stopColor="#ca8a04" />
          </linearGradient>
          <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#1d4ed8" />
            <stop offset="100%" stopColor="#1e3a8a" />
          </linearGradient>
        </defs>
        <path id="textArc" d="M 50,200 A 150,150 0 0,1 350,200" fill="none" />
        <text fill="#ffffff" fontSize="24" fontWeight="bold" letterSpacing="4">
          <textPath href="#textArc" startOffset="50%" textAnchor="middle">
            THEBES LANGUAGE
          </textPath>
        </text>
        <path d="M 110,130 L 290,130 C 290,260 200,310 200,310 C 200,310 110,260 110,130 Z" fill="url(#goldGrad)" stroke="#ffffff" strokeWidth="4" />
        <path d="M 116,136 L 284,136 C 284,255 200,300 200,300 C 200,300 116,255 116,136 Z" fill="#0284c7" />
        <rect x="120" y="140" width="78" height="70" fill="#ffffff" />
        <text x="159" y="192" fill="url(#goldGrad)" fontSize="52" fontFamily="serif" fontWeight="bold" textAnchor="middle">T</text>
        <rect x="202" y="140" width="78" height="70" fill="url(#blueGrad)" />
        <path d="M 241,152 L 270,165 L 241,178 L 212,165 Z" fill="url(#goldGrad)" />
        <path d="M 223,172 L 223,185 C 223,190 259,190 259,185 L 259,172" fill="url(#goldGrad)" />
        <rect x="120" y="212" width="78" height="70" fill="url(#blueGrad)" />
        <path d="M 134,235 C 145,230 155,235 159,238 C 163,235 173,230 184,235 L 184,260 C 173,255 163,260 159,263 C 155,260 145,255 134,260 Z" fill="#ffffff" stroke="url(#goldGrad)" strokeWidth="2" />
        <rect x="202" y="212" width="78" height="70" fill="#ffffff" />
        <text x="241" y="264" fill="url(#goldGrad)" fontSize="52" fontFamily="cursive, serif" fontWeight="bold" textAnchor="middle">S</text>
        <line x1="200" y1="140" x2="200" y2="282" stroke="url(#goldGrad)" strokeWidth="4" />
        <line x1="120" y1="210" x2="282" y2="210" stroke="url(#goldGrad)" strokeWidth="4" />
        <path d="M 60,260 C 130,360 270,360 340,260 C 310,290 270,315 200,315 C 130,315 90,290 60,260 Z" fill="url(#goldGrad)" />
        <path id="ribbonArc" d="M 80,285 C 130,335 270,335 320,285" fill="none" />
        <text fill="#ffffff" fontSize="22" fontWeight="900" letterSpacing="6">
          <textPath href="#ribbonArc" startOffset="50%" textAnchor="middle">
            MAADI GRADE 5
          </textPath>
        </text>
      </svg>
    );

    const SWEAR_WORDS = [
      'fuck', 'shit', 'bitch', 'asshole', 'bastard', 'crap', 'dick', 'pussy',
      'koss', 'kos', 'sharmouta', 'entom', 'ahbal', 'kalb', 'khara', 'gahba',
      'damn', 'stupid'
    ];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [studentNameInput, setStudentNameInput] = useState('');
      const [secretCodeInput, setSecretCodeInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isBanned, setIsBanned] = useState(false);
      const [banReason, setBanReason] = useState('');

      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('global_chat');
      const [toastMessage, setToastMessage] = useState(null);

      const [globalMessages, setGlobalMessages] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const chatEndRef = useRef(null);

      const [onlineStudents, setOnlineStudents] = useState([]);

      const [aiMessages, setAiMessages] = useState([]);
      const [aiInput, setAiInput] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const aiChatEndRef = useRef(null);

      useEffect(() => {
        try {
          const localBan = localStorage.getItem('thebes_banned');
          if (localBan) {
            setIsBanned(true);
            setBanReason(localBan);
          }
        } catch (e) {}

        try {
          const saved = localStorage.getItem('thebes_global_messages_v3');
          if (saved) {
            setGlobalMessages(JSON.parse(saved));
          } else {
            setGlobalMessages([{
              id: 'init_welcome',
              sender: 'Mohamed Hossam (SITE IT & SITE OWNER) 👑',
              isOwner: true,
              text: 'Welcome to the official live Grade 5 portal for Thebes Language School Maadi! All messages update live.',
              time: '10:00 AM',
              createdAt: Date.now()
            }]);
          }
        } catch (e) {}

        let channel;
        try {
          channel = new BroadcastChannel('thebes_grade5_v3');
          channel.onmessage = (event) => {
            const { type, payload } = event.data;
            if (type === 'NEW_MESSAGE') {
              setGlobalMessages(prev => {
                if (prev.some(m => m.id === payload.id)) return prev;
                const updated = [...prev, payload];
                try { localStorage.setItem('thebes_global_messages_v3', JSON.stringify(updated)); } catch(e){}
                return updated;
              });
            } else if (type === 'PRESENCE_PING') {
              setOnlineStudents(prev => {
                const cleaned = prev.filter(s => s.name !== payload.name && (Date.now() - (s.lastSeen || 0) < 12000));
                return [...cleaned, { ...payload, lastSeen: Date.now() }];
              });
            }
          };
        } catch (e) {}

        return () => { if (channel) channel.close(); };
      }, []);

      useEffect(() => {
        if (!isLoggedIn || !user || isBanned) return;

        const sendHeartbeat = () => {
          const myPresence = {
            name: user.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : user.name,
            isOwner: user.isOwner,
            lastSeen: Date.now()
          };

          setOnlineStudents(prev => {
            const cleaned = prev.filter(s => s.name !== myPresence.name && (Date.now() - (s.lastSeen || 0) < 12000));
            return [...cleaned, myPresence];
          });

          try {
            const channel = new BroadcastChannel('thebes_grade5_v3');
            channel.postMessage({ type: 'PRESENCE_PING', payload: myPresence });
            channel.close();
          } catch (e) {}
        };

        sendHeartbeat();
        const interval = setInterval(sendHeartbeat, 4000);
        return () => clearInterval(interval);
      }, [isLoggedIn, user, isBanned]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [globalMessages]);

      useEffect(() => {
        aiChatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [aiMessages, isAiLoading]);

      const showNotification = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3800);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const cleanName = studentNameInput.trim();
        const cleanCode = secretCodeInput.trim();

        const isOwnerCode = cleanCode === 'Iamtheowner_lol';
        const isStudentCode = cleanCode === 'PRIM5EDU';

        if (!isOwnerCode && !isStudentCode) {
          setLoginError('❌ Incorrect Secret Passcode! (Student Code: PRIM5EDU)');
          return;
        }

        if (!cleanName) {
          setLoginError('❌ Please enter your full name');
          return;
        }

        const isOwner = isOwnerCode || cleanName.toLowerCase().replace(/\s+/g, '') === 'mohamedhossam';
        const formattedName = isOwner ? 'Mohamed Hossam' : cleanName;

        const newUser = {
          name: formattedName,
          isOwner: isOwner,
          xp: isOwner ? 1000 : 250,
          swearCount: 0
        };

        setUser(newUser);
        setIsLoggedIn(true);

        const initialAiText = isOwner
          ? `Welcome back, Master Mohamed Hossam! 👑 EduAi is online and at your service for Grade 5.`
          : `Hello ${formattedName}! I am EduAi, your Grade 5 tutor. Feel free to ask me study questions or mention me (@EduAi) in the Global Chat!`;

        setAiMessages([
          { id: 1, sender: 'EduAi 🤖', text: initialAiText, time: 'Just now', isAi: true }
        ]);

        showNotification(`Welcome ${isOwner ? 'Master Mohamed Hossam!' : formattedName}`);
      };

      const checkForProfanity = (text) => {
        const lower = text.toLowerCase();
        return SWEAR_WORDS.some(word => lower.includes(word));
      };

      const executeBan = (reason) => {
        setIsBanned(true);
        setBanReason(reason);
        setIsLoggedIn(false);
        try { localStorage.setItem('thebes_banned', reason); } catch (e) {}
      };

      const handleSendGlobalMessage = async (e) => {
        e.preventDefault();
        const text = chatInput.trim();
        if (!text || !user || isBanned) return;

        if (checkForProfanity(text)) {
          const updatedSwearCount = user.swearCount + 1;
          setUser(prev => ({ ...prev, swearCount: updatedSwearCount }));

          if (updatedSwearCount >= 3) {
            executeBan('Violation of Rule #1: Account banned permanently for repeating profane language in school chat.');
            return;
          } else {
            showNotification(`⚠️ WARNING (${updatedSwearCount}/3): Swearing is forbidden! At 3 warnings your account WILL BE BANNED.`);
            setChatInput('');
            return;
          }
        }

        const senderDisplayName = user.isOwner 
          ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' 
          : user.name;

        const msgObj = {
          id: Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          sender: senderDisplayName,
          isOwner: user.isOwner,
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          createdAt: Date.now()
        };

        setChatInput('');
        setGlobalMessages(prev => [...prev, msgObj]);

        try {
          const channel = new BroadcastChannel('thebes_grade5_v3');
          channel.postMessage({ type: 'NEW_MESSAGE', payload: msgObj });
          channel.close();
        } catch (e) {}

        try {
          const current = JSON.parse(localStorage.getItem('thebes_global_messages_v3') || '[]');
          localStorage.setItem('thebes_global_messages_v3', JSON.stringify([...current, msgObj]));
        } catch (e) {}

        if (text.toLowerCase().includes('eduai') || text.toLowerCase().includes('@eduai') || text.endsWith('?')) {
          triggerEduAiInGlobalChat(text);
        }
      };

      const triggerEduAiInGlobalChat = async (userQuestion) => {
        try {
          const systemPrompt = `You are EduAi, the smart AI assistant inside the live Global Chat for Grade 5 at Thebes Language School Maadi.
          IMPORTANT RULE 1: If talking to Mohamed Hossam, ALWAYS address him as "Master Mohamed Hossam" or "Master".
          IMPORTANT RULE 2: Keep responses concise (2-4 sentences max) suitable for a live group chat board.`;

          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userQuestion }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });

          const data = await response.json();
          let replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text || 
            (user.isOwner 
              ? "Master Mohamed Hossam, EduAi is at your service in Global Chat!" 
              : "I am EduAi! Ask me any Grade 5 homework question!");

          const aiMsgObj = {
            id: 'ai_' + Date.now(),
            sender: 'EduAi 🤖',
            isAi: true,
            text: replyText,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            createdAt: Date.now() + 100
          };

          setTimeout(() => {
            setGlobalMessages(prev => [...prev, aiMsgObj]);
          }, 800);

        } catch (err) {
          console.error(err);
        }
      };

      const handleSendAiTabMessage = async (customPrompt) => {
        const query = customPrompt || aiInput;
        if (!query.trim() || isAiLoading) return;

        const userMsg = {
          id: Date.now(),
          sender: user.isOwner ? 'Master Mohamed Hossam 👑' : user.name,
          text: query,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          isAi: false
        };

        setAiMessages(prev => [...prev, userMsg]);
        if (!customPrompt) setAiInput('');
        setIsAiLoading(true);

        try {
          const systemPrompt = `You are EduAi, an expert Grade 5 AI tutor for Thebes Language School Maadi.
          RULE: If the student is Mohamed Hossam, address him strictly as "Master Mohamed Hossam" or "Master" in every response.`;

          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: query }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });

          const data = await response.json();
          let replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "How can I assist your Grade 5 studies today?";

          setAiMessages(prev => [
            ...prev,
            {
              id: Date.now() + 1,
              sender: 'EduAi 🤖',
              text: replyText,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              isAi: true
            }
          ]);
        } catch (err) {
          console.error(err);
        } finally {
          setIsAiLoading(false);
        }
      };

      if (isBanned) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-red-950/40 border border-red-600/50 rounded-3xl p-8 text-center space-y-6 backdrop-blur-xl shadow-2xl">
              <div className="w-20 h-20 bg-red-600/20 text-red-500 rounded-full flex items-center justify-center text-4xl mx-auto border border-red-500/40 animate-pulse">
                🚫
              </div>
              <div className="space-y-2">
                <h1 className="text-2xl font-black text-red-400">ACCOUNT PERMANENTLY BANNED</h1>
                <p className="text-xs text-slate-300">Thebes Language School Grade 5 Community Standard Violation</p>
              </div>
              <div className="bg-slate-900/90 border border-red-500/30 p-4 rounded-2xl text-xs text-red-300 font-mono text-left leading-relaxed">
                {banReason || 'Repeated use of prohibited profanity in global chat (3 strike limit reached).'}
              </div>
              <p className="text-[11px] text-slate-400">
                Contact Site Owner & IT <strong>Mohamed Hossam</strong> if you believe this is an error.
              </p>
            </div>
          </div>
        );
      }

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden font-sans">
            <div className="w-full max-w-md bg-slate-900/95 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-md relative z-10 space-y-6">
              <div className="text-center space-y-3">
                <ThebesLogo className="w-20 h-20 mx-auto drop-shadow-xl" />
                <h1 className="text-2xl font-black bg-gradient-to-r from-white via-amber-200 to-amber-400 bg-clip-text text-transparent">
                  THEBES MAADI GRADE 5
                </h1>
                <div className="inline-block bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                  🔒 Class Passcode Gate
                </div>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Your Full Name:</label>
                  <input
                    type="text"
                    required
                    value={studentNameInput}
                    onChange={(e) => setStudentNameInput(e.target.value)}
                    placeholder="e.g. Mohamed Hossam"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400 transition"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Class Secret Passcode:</label>
                  <input
                    type="password"
                    required
                    value={secretCodeInput}
                    onChange={(e) => setSecretCodeInput(e.target.value)}
                    placeholder="Enter secret code"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400 transition"
                  />
                  <span className="text-[10px] text-amber-400/80 mt-1 block">💡 Passcode: PRIM5EDU (Students)</span>
                </div>

                {loginError && (
                  <div className="bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold p-3 rounded-xl text-center">
                    {loginError}
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 text-slate-950 font-black py-3.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/20 hover:brightness-110"
                >
                  🚀 Unlock Grade 5 Community
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">
          {toastMessage && (
            <div className="fixed top-20 right-4 z-50 bg-amber-500 text-slate-950 px-5 py-3 rounded-xl shadow-2xl font-bold border border-amber-300 animate-bounce flex items-center gap-2">
              <span>✨</span> {toastMessage}
            </div>
          )}

          <div className="bg-gradient-to-r from-blue-950 via-indigo-950 to-blue-950 border-b border-blue-800/50 py-2 px-4 text-xs font-medium flex items-center justify-between">
            <div className="flex items-center gap-2 shrink-0">
              <span className="bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border border-amber-400/30">
                THEBES MAADI GRADE 5
              </span>
            </div>

            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-800">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
                <span className="text-xs text-emerald-300 font-bold">
                  {onlineStudents.length > 0 ? onlineStudents.length : 1} Active Student{onlineStudents.length > 1 ? 's' : ''} Online
                </span>
              </div>

              <button onClick={() => setIsLoggedIn(false)} className="text-xs text-slate-400 hover:text-red-400 transition">
                🔒 Exit
              </button>
            </div>
          </div>

          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <ThebesLogo className="w-12 h-12" />
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-black tracking-tight text-white">
                      THEBES COMMUNITY
                    </h1>
                    {user.isOwner && (
                      <span className="bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-md shadow-md animate-pulse">
                        SITE IT & SITE OWNER 👑
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-amber-400 font-semibold tracking-wider uppercase -mt-0.5">
                    <span>{user.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : user.name}</span>
                  </p>
                </div>
              </div>

              <nav className="flex items-center gap-1 bg-slate-950/60 p-1.5 rounded-2xl border border-slate-800">
                {[
                  { id: 'global_chat', label: 'Global Chat', icon: '🌐' },
                  { id: 'eduai', label: user.isOwner ? 'EduAi Master Assistant' : 'EduAi Assistant', icon: '🤖' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center gap-2 ${
                      activeTab === item.id
                        ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-600/30'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'global_chat' && (
              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 h-[680px]">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4 flex flex-col justify-between">
                  <div>
                    <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider px-2 flex items-center justify-between">
                      <span>🟢 Online Students</span>
                      <span className="bg-amber-400/20 text-amber-300 px-2 py-0.5 rounded-full font-mono text-[10px]">
                        {onlineStudents.length || 1}
                      </span>
                    </h3>

                    <div className="space-y-2 mt-4 max-h-[460px] overflow-y-auto">
                      {onlineStudents.length > 0 ? (
                        onlineStudents.map((st, i) => (
                          <div key={i} className="p-2.5 bg-slate-950/70 border border-slate-800 rounded-xl flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-blue-900/60 border border-blue-500/40 flex items-center justify-center font-bold text-amber-300 text-xs">
                              {st.isOwner ? '👑' : st.name.charAt(0)}
                            </div>
                            <div className="overflow-hidden">
                              <div className="text-xs font-bold text-white flex items-center gap-1 truncate">
                                <span>{st.name}</span>
                              </div>
                            </div>
                          </div>
                        ))
                      ) : (
                        <div className="p-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-xs text-slate-400 text-center">
                          {user.isOwner ? 'Mohamed Hossam (SITE IT & SITE OWNER) 👑' : user.name}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="bg-amber-950/30 border border-amber-800/40 p-3 rounded-xl text-[11px] text-amber-300 space-y-1">
                    <div className="font-bold">⚠️ Swear Filter Active:</div>
                    <p className="text-slate-300">Swearing is forbidden! 3 warnings result in a permanent ban.</p>
                  </div>
                </div>

                <div className="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-2xl">
                  <div className="border-b border-slate-800 pb-3 mb-3 flex items-center justify-between px-2">
                    <div>
                      <h2 className="font-black text-white text-lg flex items-center gap-2">
                        <span>🌐 Real-Time Global Student Chat</span>
                      </h2>
                      <p className="text-xs text-slate-400">Live chat for Grade 5 students • Mention @EduAi for instant AI answers</p>
                    </div>
                  </div>

                  <div className="overflow-y-auto flex-1 space-y-3 pr-2">
                    {globalMessages.map((msg, idx) => (
                      <div 
                        key={msg.id || idx}
                        className={`p-3.5 rounded-2xl space-y-1.5 transition ${
                          msg.isAi 
                            ? 'bg-amber-950/30 border border-amber-500/50 text-amber-200'
                            : msg.isOwner 
                              ? 'bg-gradient-to-r from-amber-950/40 via-slate-900 to-slate-900 border border-amber-500/40' 
                              : 'bg-slate-950/80 border border-slate-800'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className={`font-bold text-sm flex items-center gap-1 ${
                            msg.isAi ? 'text-amber-400' : msg.isOwner ? 'text-amber-300' : 'text-blue-300'
                          }`}>
                            {msg.sender}
                          </span>
                          <span className="text-[10px] text-slate-500 font-mono">{msg.time}</span>
                        </div>
                        <p className="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                      </div>
                    ))}
                    <div ref={chatEndRef} />
                  </div>

                  <form onSubmit={handleSendGlobalMessage} className="mt-4 flex gap-2 pt-3 border-t border-slate-800">
                    <input
                      type="text"
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      placeholder={`Send a global message (e.g. Ask @EduAi a question)...`}
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition"
                    />
                    <button
                      type="submit"
                      disabled={!chatInput.trim()}
                      className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold px-6 py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/30"
                    >
                      Send 🚀
                    </button>
                  </form>
                </div>
              </div>
            )}

            {activeTab === 'eduai' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-gradient-to-r from-blue-950 via-indigo-900 to-slate-900 border border-blue-700/50 rounded-2xl p-6 flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-400 to-yellow-200 text-slate-950 flex items-center justify-center text-3xl font-black shadow-lg shadow-amber-400/20">
                      🤖
                    </div>
                    <div>
                      <h2 className="text-2xl font-black text-white">
                        EduAi {user.isOwner ? 'Master Assistant' : 'Grade 5 Tutor'}
                      </h2>
                      <p className="text-xs text-slate-300">
                        {user.isOwner ? "Master Mohamed Hossam, EduAi is at your service!" : "Ask Grade 5 homework questions, math steps, or language help!"}
                      </p>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-6 h-[500px] flex flex-col justify-between shadow-2xl">
                  <div className="overflow-y-auto space-y-4 pr-2">
                    {aiMessages.map((msg) => (
                      <div key={msg.id} className={`flex items-start gap-3 ${msg.isAi ? '' : 'flex-row-reverse'}`}>
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg shrink-0 ${
                          msg.isAi ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-blue-600 text-white'
                        }`}>
                          {msg.isAi ? '🤖' : '👨‍🎓'}
                        </div>
                        <div className={`max-w-[80%] rounded-2xl p-4 space-y-1 text-sm leading-relaxed ${
                          msg.isAi ? 'bg-slate-800/90 border border-slate-700/60 text-slate-100' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg'
                        }`}>
                          <div className="flex items-center justify-between text-[10px] opacity-75 font-semibold">
                            <span>{msg.sender}</span>
                            <span>{msg.time}</span>
                          </div>
                          <div className="whitespace-pre-wrap">{msg.text}</div>
                        </div>
                      </div>
                    ))}
                    {isAiLoading && (
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-xl bg-amber-400/20 text-amber-300 flex items-center justify-center text-lg animate-spin">
                          🤖
                        </div>
                        <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-3 text-xs text-amber-300 font-semibold animate-pulse">
                          EduAi is preparing a response...
                        </div>
                      </div>
                    )}
                    <div ref={aiChatEndRef} />
                  </div>

                  <form onSubmit={(e) => { e.preventDefault(); handleSendAiTabMessage(); }} className="mt-4 flex gap-2 pt-3 border-t border-slate-800">
                    <input
                      type="text"
                      value={aiInput}
                      onChange={(e) => setAiInput(e.target.value)}
                      placeholder={user.isOwner ? "Ask EduAi anything, Master Mohamed Hossam..." : "Ask EduAi any Grade 5 question..."}
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition"
                    />
                    <button
                      type="submit"
                      disabled={isAiLoading || !aiInput.trim()}
                      className="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 disabled:opacity-50 text-slate-950 font-extrabold px-6 py-3 rounded-xl text-sm transition shadow-lg shadow-amber-500/20"
                    >
                      Ask
                    </button>
                  </form>
                </div>
              </div>
            )}
          </main>

          <footer className="mt-16 border-t border-slate-800/80 bg-slate-950 py-8 px-4 text-center text-xs text-slate-500 space-y-2">
            <p>© 2026 Thebes Language School - Maadi Branch. Managed by Mohamed Hossam (SITE IT & SITE OWNER).</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
